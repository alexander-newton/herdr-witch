[package]
name = "herdr-witch"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
fastrand = "2"
rustix = { version = "1", features = ["termios", "fs", "process"] }
unicode-width = "0.2"

[dev-dependencies]
insta = "1"
# pty: a pseudo-terminal for the witch panes in tests/pane_tty.rs
rustix = { version = "1", features = ["termios", "fs", "process", "pty"] }

[features]
# Exposes herdr::fake::FakeHerdr outside unit tests.
fake = []
